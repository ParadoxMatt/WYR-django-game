<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would you rather?</title>
</head>
<body>
    <form action="{% url 'WYR:votes' scenario.id %}" method="post">
    
        {% csrf_token %}
    
        <fieldset>
            <Legend>Would you rather?...</Legend>

            <button name="choice" value="1">
                {{ scenario.scenario_question_1 }}
            </button>
    
    
            <button name="choice" value="2">
                {{ scenario.scenario_question_2 }}
            </button>
    
        </fieldset>
    
    </form>
    
    <footer>
        <p>&copy; 2026 Matthew Chihata</p>
    </footer>
</body>
</html>
